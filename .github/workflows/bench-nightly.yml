# Full bench (L0-L4) on dev, Monday and Wednesday night, on the lab box.
# A break is then traced to a few days of commits. See PROJECT_PLAN T0.11.
#
# Runs on the self-hosted runner labelled lab-box, never on a PR, so no
# outside code reaches the box. L5-L6 (robot) are never run here.
# Skipped levels still pass for now. The no-skips switch is still owed (T0.11).
name: bench-nightly

on:
  schedule:
    - cron: '0 15 * * 1,3'   # 23:00 Singapore time, Mon and Wed (cron is UTC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

concurrency: lab-box          # never two runs at once on the box

jobs:
  full:
    runs-on: [self-hosted, lab-box]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          clean: false        # keep build folders, .venv and weight links between runs
      - run: ./bench/run.sh
