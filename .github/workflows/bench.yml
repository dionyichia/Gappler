# Runs the bench on every PR into main and every push to main. See NEXT_STEPS.md
# 2.12 and PROJECT_PLAN T0.10. Levels are defined in bench/README.md.
#
# GitHub's machine has no ROS, so L0-L2 run and L3-L4 report SKIPPED. That is
# allowed for now. A self-hosted runner on the lab box is T0.11.
# A green run does NOT mean the robot works. L5 (hardware) is never run here.
name: bench

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  bench:
    # 22.04 ships Python 3.10, the same as ROS 2 Humble on the lab box.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: ./bench/run.sh
