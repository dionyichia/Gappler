# Settings more than one subsystem reads. Each value is written once (NEXT_STEPS 2.15).
# This is a ROS parameter file, so a launch file can pass it to any node as is.
# Python outside ROS reads it through shared/gappler_common.py.
/**:
  ros__parameters:
    # Some of these are only read inside aria. They move to aria/config in reorg step 4.
    topics:
      rgb_camera_raw: "/aria/rgb_camera/raw"
      rgb_camera_undistorted: "/aria/rgb_camera/undistorted"
      slam_left_raw: "/aria/slam_left/raw"
      slam_right_raw: "/aria/slam_right/raw"
      eye_tracking_raw: "/aria/eye_tracking/raw"
      eye_tracking_gaze_estimate: "/aria/eye_tracking/gaze_estimate"
      rgb_camera_with_object_masks: "/aria/rgb_camera/object_masks"
      ros_camera_with_object_masks: "/realman/rgb_camera/object_masks"
      combined_visualization: "/combined/object_masks"
      feature_match_results: "/aria/rgb_camera/feature_match"
      audio_transcription_prompt: "/aria/audio/prompt"
      imu: "/aria/imu"
      aruco_pose: "/aria/aruco_pose"
      vio_pose: "/aria/vio_pose"
      fused_pose: "/aria/fused_pose"
      is_stationary: "/aria/is_stationary"

    qos:
      video:
        reliability: "BEST_EFFORT"
        history: "KEEP_LAST"
        depth: 10

    # Camera serial numbers. Two RealSense cameras are plugged into the box, so every launch
    # names the one it wants (T1.13). Without a serial the driver opens whichever it finds
    # first. Override per machine with WRIST_CAMERA_SERIAL and MOBILE_BASE_CAMERA_SERIAL.
    wrist_camera:
      serial: "243222074878"   # D435i on the arm's wrist, Link6. Confirmed at the robot, T1.4
    mobile_base_camera:
      serial: ""               # D455, forward facing on the base. Mounted. Read its serial off
                               # the box and fill this in: rs-enumerate-devices -s (T1.13)

    # Fixed mounts: metres/radians relative to named parent frames.
    # rpy is roll/pitch/yaw; the helper converts to the legacy TF CLI order.
    geometry:
      # JSON flow mappings are valid YAML and keep the stdlib contract scanner
      # able to resolve these entries without importing ROS or PyYAML.
      arm_mount: {"parent": "robot_base_link", "child": "base_link", "xyz_m": [0.18, 0.0, 0.48], "rpy_rad": [0.0, 0.0, 3.14159]}
      # Retained launch geometry, not newly measured.
      lidar_mount: {"parent": "robot_base_link", "child": "livox_frame", "xyz_m": [0.18, 0.0, 0.2], "rpy_rad": [0.0, 0.0, 0.0]}
      # Screw frame is reserved, not published yet. As-fitted 2026-10-06;
      # zero angles estimated by eye, uncertainty unknown.
      d455_bottom_screw: {"parent": "robot_base_link", "child": "base_d455_bottom_screw_frame", "xyz_m": [0.208, 0.0, 0.528], "rpy_rad": [0.0, 0.0, 0.0]}
      # Independent legacy references preserve behavior pending Dion's decision.
      # Neither is the D455 screw/sensor offset or a measured front edge.
      legacy_approach_reference_x_m: 0.18
      legacy_return_front_x_m: 0.18

    # Paths outside the repo. Each can be overridden per machine with GAPPLER_<NAME>,
    # for example GAPPLER_MAP_DIR for map_dir. A relative path is from the repo root.
    paths:
      openvins_ws: "~/Ros2Workspaces/OpenVINS"   # an OpenVINS build outside this repo
      map_dir: "~/maps"                          # saved SLAM maps (nav): current_map, completed_map
