# Grasp config. Values only the grasp subsystem reads (NEXT_STEPS 2.15).
# Values another subsystem also reads (the wrist camera topics, the mask and centroid, the
# gripper commands) live in shared/global_config.yaml. Each value is written once.
#
# How it is read:
#   Python nodes:  gappler_common.config("grasp", "<node name>"), which adds global + "/**" below
#                  + that node's section.
#   grasp_state_machine (C++): grasp_state_machine.launch.py loads global_config.yaml, then this
#                  file, as ROS parameters. A missing parameter stops the node at start-up.
# Edit a value and restart the node. No rebuild: the launch file reads this file from the repo.
#
# Format: a ROS parameter file. "/**" holds values two or more grasp nodes read. Each other
# top-level key is one node, by its ROS node name.
/**:
  ros__parameters:
    # Topics only grasp publishes and reads. publisher -> subscribers.
    topics:
      # anygrasp_node, anygrasp_detection_node -> grasp_state_machine, grasp_viz
      grasp_candidates: "/grasp_candidates"
      # grasp_state_machine -> anygrasp_node, anygrasp_detection_node, grasp_viz
      pipeline_state: "/pipeline_state"
      # grasp_viz -> RViz (debug only, these four)
      grasp_candidate_markers: "/grasp_candidate_markers"
      debug_sam_mask: "/debug/sam_mask"
      debug_centroid_marker: "/debug/centroid_marker"
      debug_state_marker: "/debug/state_marker"
      # anygrasp_detection_node -> RViz (debug): the masked points AnyGrasp was given (T1.34)
      debug_anygrasp_points: "/debug/anygrasp_points"
      # anygrasp_detection_node -> grasp_state_machine: the target as a box in base_link, for
      # MoveIt's planning scene (T1.48). moveit_msgs/CollisionObject, id grasp_target
      grasp_target_object: "/grasp/target_object"
    # Top of the table, in metres above the arm's base_link. The planner's "table" collision box
    # sits just under it, and the target box stands on it (T1.48). Measured 2026-10-13 (T1.24 3c):
    # 0.68 m from the floor, 0.12 m above the arm base. Was hard-coded at 0.195 m, 7.5 cm too high,
    # which stopped the approach short.
    # read by: grasp_state_machine, anygrasp_detection_node
    table_top_z_m: 0.12

# grasp/grasp_segmentation_client/grasp_segmentation_client.py
grasp_segmentation_client:
  ros__parameters:
    # FOR TESTING THE GRASP CLIENT WITHOUT THE GLASSES ONLY (bench, arm bring-up).
    # Used at start when nothing publishes on /grasp/target. Dropped as soon as something does,
    # or on the first Target message, so a spoken word always wins. "" = wait for a Target.
    default_prompt: "box"
    # Give up on a request with no reply after this long, so a service that dies mid-call does not
    # stall the client for good. A normal call takes about 0.25 s.
    segment_timeout_s: 5.0
    # Sent with every request. The service's defaults are looser, for the glasses (T2.9). The grasp
    # client keeps the values it was tested with. Only masks above min_score reach the CLIP match
    # against the glasses reference (T8.9a), so a looser cutoff gives CLIP more to choose from.
    # min_score: SAM 3's own score, 0 to 1. max_detections: the most masks per reply, best first.
    min_score: 0.5
    max_detections: 5

# grasp/anygrasp_node/anygrasp_detection_node.py
anygrasp_detection_node:
  ros__parameters:
    # Which AnyGrasp SDK to run: a folder in grasp/anygrasp_node/ with its gsnet .so and licence
    # (T1.45). anygrasp3 (July 2026 SDK) gets the whole scene and is steered to the SAM mask.
    # anygrasp2 (old SDK) gets only the masked points. Keep anygrasp2 until anygrasp3 passes
    # Dion's 24-trial validation, then delete it and workspace_limits_m.
    anygrasp_sdk: anygrasp3
    # anygrasp3 only. Scene points kept around the object's 3D box for the collision check, metres.
    # The gripper model is 0.10 m open, so a grasp on the object reaches about 0.10 m past it.
    # Smaller is faster: the whole scene took 2.3 s a frame on the wrist bag (T1.45).
    scene_margin_m: 0.15
    # anygrasp2 only (AnyGrasp 3 has no lims). Workspace box in the camera frame, metres:
    # [x_min, x_max, y_min, y_max, z_min, z_max]. Wide on purpose: the SAM mask does the filtering.
    workspace_limits_m: [-1.0, 1.0, -1.0, 1.0, 0.0, 1.5]
    # AnyGrasp's gripper model, not the real opening (the real gripper opens about 71 mm).
    # AnyGrasp reports every grasp at this width and needs clearance around the object: told
    # 0.07, it found no grasp on a 6 cm box face (top score 0.005); told 0.10, 0.34 to 0.5
    # (T1.17, bench-runs/2026-10-14-labbox-t1.17-anygrasp-live.txt). It does not check the
    # object fits in 71 mm (T1.32).
    max_gripper_width_m: 0.10
    # AnyGrasp's gripper model height, metres (the SDK's gripper_height). The SDK demo uses 0.03.
    # 0.04 since the node was written (2026-04-07, f24c6d5), reason not recorded. [unverified]
    # what the SDK does with it. Every AnyGrasp result so far used 0.04.
    anygrasp_gripper_height_m: 0.04
    # Depth readings beyond this are dropped before AnyGrasp sees the cloud, metres. The object
    # sits about 0.2 to 0.5 m from the wrist camera, and D4xx noise grows with depth squared.
    # grasp/tools/wrist_camera_bag_to_point_cloud_page.py shows the same cut.
    max_point_depth_m: 1.5
    # Keep grasps whose approach is within this angle of the wrist camera's view axis. anygrasp3
    # is steered to it (approach_steering), anygrasp2 drops the rest afterwards. A first-run safety
    # limit (Dion, 2026-10-14). Without it, most grasps came from the side or across the top face.
    # Kept at 10 (Dion, 2026-10-26): at 30 and 20, 4 of 5 grasps failed to plan (no IK for the
    # pre-grasp, or the straight-in move stopped partway), and 10 grasped with no push.
    # 90 = off since T1.51 (Dion, 2026-11-03): each stage does its own job, and with it off the real
    # arm locked a good top-down grasp the 10 deg cone never gave. Narrow it again only if a face
    # steering rule is needed later.
    max_approach_deg: 90
    # T1.32: does the object fit the REAL gripper? AnyGrasp cannot tell (it is told 0.10 m above),
    # so the node measures each grasp from the masked points and drops it if any limit fails.
    # Gripper (Dion, 2026-10-14): a U 50 mm deep inside, opens 71 mm, rubber pads 16 mm long.
    # Widest the object may be where the pads close, metres. 71 mm opening minus 3 mm for depth
    # noise. A 6 cm box measures about 63 mm in the point cloud (step 7a). Raise toward 0.071 if
    # good grasps are dropped, lower if grasps close on objects that do not fit.
    # [unverified] whether 71 mm is between the pads or outside them (pads about 2 mm a side).
    max_object_width_m: 0.068
    # T1.54: furthest the object may reach from the grasp centre on either side, metres. Half the
    # 71 mm opening, no margin: the width check alone passes a narrow object sitting off-centre,
    # where one finger lands on it. Above 0.0355 a finger can land on the object. Lower it if a
    # finger still does. Read by anygrasp_detection_node (fits_gripper). Offline numbers: task tree T1.54.
    max_object_side_m: 0.0355
    # Furthest the fingertips may go past the object's near face, metres. Past 0.050 the base of
    # the U pushes the object. 5 mm kept as margin. In step 7c tips went up to 0.133 m in.
    max_grasp_depth_m: 0.045
    # Height of the slice measured, across the finger, metres. Roughly the pad width. [unverified]
    # Larger counts more of the object (safer for boxes, drops grasps on narrow necks).
    finger_height_m: 0.02
    # Ignore this percent of points at each edge of the slice. They are often flying pixels: the
    # camera mixes near and far depth at an edge. 0 uses the extreme points (strays then make
    # objects look wider). Raise if stray points still widen objects.
    fit_percentile: 2
    # T1.48: added to every side of the target box (and its top) for MoveIt's planning scene, metres.
    # Depth noise must never make the box smaller than the object. Raise if the arm still brushes it.
    target_box_pad_m: 0.01
    # T1.48: the target box's footprint ignores this percent of points at each side, so a few stray
    # points beside the object cannot widen it. 0.5 since T1.60: mask spill is removed first
    # (denoise_*), and 2 shaved real edges (the 7.4 cm side read 6.9). Raise if strays widen the box.
    target_box_edge_percentile: 0.5
    # T1.48: the box top is this percentile of the object points' heights, so flying pixels far above
    # the object cannot raise it.
    target_box_top_percentile: 99.0
    # T1.48: the box starts this far above the table, metres. MoveIt counts touching as a collision,
    # so a box on the table slab would start every move in collision. Grasps sit far above 5 mm.
    target_box_table_gap_m: 0.005
    # T1.48: the footprint's turn is searched in steps of this many degrees. The 1 cm pad is far
    # larger than the error half a step gives on a 15 cm box (about 1 mm).
    target_box_angle_step_deg: 1.0

    # T1.60: remove table and stray pixels from SAM's mask before AnyGrasp, the fit check and the
    # target box use it (grasp/anygrasp_node/denoise_point_cloud.py). The mask spills onto the table
    # behind the object, and the camera reads that table 1.5 to 2.5 cm high, so table_top_z does not
    # catch it. Tuned on captures A, B, C and a synthetic test set (T1.60 notes in the task tree).
    # The table's facing may differ from TF's up by at most this, degrees. A wall or a box side
    # (about 90) is never taken as the table. Captures A, B, C measured 1.0 to 2.0.
    denoise_max_tilt_deg: 20.0
    # Wrist camera depth noise at 0.5 m, metres. Grows with depth squared (D4xx class camera).
    denoise_depth_noise_at_half_metre_m: 0.0015
    # A point within this many noise widths of the plane counts as table when fitting it.
    denoise_table_band_sigmas: 3.0
    # Least and most that band may be, metres. The cap stops far points (noise about 4 cm at 1.5 m)
    # from pulling the floor into the table fit.
    denoise_table_band_min_m: 0.006
    denoise_table_band_max_m: 0.015
    # The table is fitted only on points within this depth of the object, metres (not the floor).
    denoise_region_depth_m: 0.3
    # The table is looked for in the mask's bounding box widened by its own size plus this, pixels.
    denoise_region_margin_px: 20
    # The mask is grown by this many pixels and left out of the table fit (its edge is unreliable).
    denoise_mask_grow_px: 10
    # Plane fit: random 3-point tries, points sampled per try, least-squares refinements.
    denoise_ransac_iterations: 300
    denoise_ransac_sample_points: 6000
    denoise_refine_passes: 2
    # The table needs at least this many points, and at most this rms distance (m), to be trusted.
    denoise_min_table_points: 800
    denoise_max_table_rms_m: 0.006
    # Mask points within this many noise widths of the table (at least table_band_min_m) are dropped.
    denoise_remove_band_sigmas: 4.0
    # Neighbouring pixels are one surface while their depth differs by less than this fraction.
    # The spill sits 15 to 20 cm behind the object, so it ends up a separate surface.
    denoise_depth_step_rel: 0.03
    # Surfaces smaller than this many pixels are ignored when deciding what else to keep.
    denoise_min_surface_pixels: 20
    # Another surface within this distance of the biggest one is kept too, metres: one object cut in
    # two by something thin in front of it.
    denoise_merge_gap_m: 0.03
    # The frame is refused (skipped) below this many object pixels.
    denoise_min_object_points: 300
    # Refused if the object is less than this share of the mask: SAM mostly missed the object.
    denoise_min_kept_frac: 0.4
    # Refused if the kept surfaces are less than this share of what lies above the table.
    denoise_min_main_frac: 0.7

    # T1.61: GraRe re-ranker (arXiv 2608.00946, grare_rerank.py). Scores every raw AnyGrasp grasp before
    # NMS, and its score replaces AnyGrasp's. Offline its first pick held in 60 of 60 real frames, at about
    # 1.2 s a frame (docs/dion_docs/local/experiments/T1.47_ideal_cloud/FINDINGS.md). Off until the
    # plan-only arm session. Weights: grare_weights and mobile_sam_weights in shared/global_config.yaml.
    # When on, /grasp_candidates carries GraRe's fused z-scores (about -3 to 5), not AnyGrasp's 0 to 1.
    # Nothing reads the value as 0 to 1: the state machine ignores it, grasp_viz.py scales per frame.
    grare:
      enabled: false
      # Weight of GraRe's score against AnyGrasp's, 0 to 1, fused as z-scores. 1 = GraRe's order only
      # (the tested setting). 0 = AnyGrasp's order, with GraRe still loaded and run.
      score_weight: 1.0
      # Speedups. Each can be turned off alone to debug. All off = GraRe's own code, about 18 s a frame.
      # Score only the first copy of each exact duplicate grasp (about half are copies). Exact.
      skip_duplicates: true
      # Give GraRe only the points that can sit near some grasp. Exact, saves little.
      crop_cloud: true
      # Neighbourhoods and their sampling on the GPU instead of a Python loop per grasp. 5 s to 1.2 s.
      gpu_neighbourhoods: true
      # Grasps scored per model batch. Lower it if the GPU runs out of memory.
      batch_size: 512
      # Grasps per GPU step when finding each grasp's neighbourhood (gpu_neighbourhoods). Higher is
      # fewer steps but more GPU memory: each step holds chunk x scene points distances in float64.
      neighbourhood_chunk: 128
      # Number format each model runs in: float32, float16 or bfloat16. Lower is faster and uses less
      # GPU memory, but changes the scores. float32 is the tested setting (T1 check). float16 and
      # bfloat16 are untested here: rerun grasp/anygrasp_node/grare_rerank.py and the T1 check first.
      model_precision: float32        # GraRe's scoring model
      mobile_sam_precision: float32   # MobileSAM, the object mask under each grasp

# grasp/grasp_viz/grasp_viz.py. Size of the gripper drawn in RViz, metres.
grasp_visualizer:
  ros__parameters:
    # Drawing only: nothing here changes a grasp. Make the drawing match the real gripper so you
    # can judge in RViz whether the fingers would sit on the object.
    # Palm: a cylinder along the approach axis, behind the fingers. Length and radius.
    palm_length_m: 0.04
    palm_radius_m: 0.006
    # Measured gripper (Dion, 2026-10-14): a U 50 mm deep inside, opens 71 mm (T1.34).
    # Fingers: bars along the approach axis, back from the tips. Length and radius.
    finger_length_m: 0.05
    finger_radius_m: 0.005
    # Distance between the fingers, gripper open.
    open_width_m: 0.071

# grasp/grasp_state_machine/src/grasp_state_machine.cpp. These move the real arm: change them
# only with a plan to test on the simulated arm first (./bench/state_machine_sim.sh).
grasp_state_machine:
  ros__parameters:
    # The approach steps toward the object, reading its depth from the wrist camera each step,
    # and stops once the depth is under execute_depth_thresh_m. Then the gripper opens and
    # the arm makes one blind step of approach_step_final_m and closes.
    # The wrist camera gives no depth closer than about 0.182 m (640x480, measured 2026-10-13,
    # T1.11). So the stop must sit above that by at least one step, or the last reading comes
    # from inside the blind zone, the centroid goes stale and the approach ends short.
    # Was 0.04 / 0.18 / 0.10: twice in a row the camera went blind at 0.182 m, 2 mm before the stop.
    approach_step_m: 0.02            # step towards the object while approaching
    # Final blind step. The stop reading is 0.19 to 0.21 m, so the jaws end 0.07 to 0.09 m from
    # the camera's view of the object. The 3c grasp (T1.24, 2026-10-13) ended at 0.077 m
    approach_step_final_m: 0.12
    max_approach_steps: 50           # 50 x 0.02 m = 1 m of approach, the object starts about 0.46 m away
    # Was 0.21. Raised so the wrist could turn away from the object (T1.45, 2026-10-26). It also
    # leaves room for the pre-grasp below. The camera sees down to 0.182 m.
    execute_depth_thresh_m: 0.30     # stop approaching when the object is this close
    # T1.63 viewing pose, all view_* keys read by grasp_state_machine.cpp (viewingPoseMove). Instead
    # of the 2 cm creep: the camera looks at the object's centroid from a planned pose, then one
    # straight move sets the nearest surface's depth. If no pose plans, the creep above runs.
    # false: the creep only.
    view_pose_enabled: true
    # Look-down angle of the camera at the viewing pose, degrees below horizontal (Dion, 2026-11-03).
    view_tilt_deg: 45.0
    # Camera to centroid distances tried, closest first. Start 0.30 (Dion, 2026-11-03): the test box's
    # half depth plus 0.22 is about 0.25 to 0.30, so the straight move after is short. The arm never
    # reached a pose at 0.60 m or more offline (T1.63 stage 1), so the search stops at 0.55.
    view_standoff_start_m: 0.30
    view_standoff_step_m: 0.05
    view_standoff_max_m: 0.55
    # Directions around the object tried at each distance, degrees about the vertical. 0 = looking
    # from the arm base. Worst case 6 distances x 7 directions = 42 plans (Dion, 2026-11-03).
    view_swing_deg: [0.0, 15.0, -15.0, 30.0, -30.0, 45.0, -45.0]
    # At the pose, the nearest masked surface is moved to this depth. The camera gives no depth below
    # about 0.182 m (T1.11), plus 4 cm margin (Dion, 2026-11-03).
    view_min_nearest_depth_m: 0.22
    # Skip the straight move if the nearest surface is already this close to 0.22. Depth noise at
    # 0.22 m is a few mm (Dion, 2026-11-03).
    view_distance_tolerance_m: 0.01
    # T1.48: AnyGrasp's grasp is reached in two moves. A path search around the target box to this
    # far back along the approach, then straight in. The MTC pick-and-place tutorial uses 0.10.
    pregrasp_distance_m: 0.10
    # T1.48: grasps tried per cycle. One that fails to plan is skipped, then the next is tried.
    # After this many, back to IDLE. Set on its own since T1.51: AnyGrasp now sends every grasp
    # that fits (about 28 a frame with the cone off), not the top 5.
    max_grasp_attempts: 5
    # T1.48: back to IDLE if no grasp locks within this time. Restarts after each failed plan.
    # Read by grasp_state_machine.cpp, and by bench/nodes/test_state_machine_sim.py, whose "never
    # locks" check waits this long plus 15 s.
    # The lower-ranked grasps can jump between frames and never lock: 86 s of silence on 2026-10-26.
    # Locks seen that day took 3 to 6 s, once 17 s. It was 25 until T1.62. With GraRe on a frame
    # takes 6 to 7 s (T1.61 arm session, 2026-11-03), so stability_n_frames 5 alone needs 30 to
    # 35 s. 90 is the value used on the arm that day (Dion, 2026-11-03): time is not the problem
    # yet, and it leaves room for a few frames that do not match.
    lock_timeout_s: 90.0
    # Refuse a move to AnyGrasp's grasp if joint 4, 5 or 6 would turn further than this (T1.45).
    # 360 = off since T1.51 (Dion, 2026-11-03): cable check on the real arm, joint 6 turned -340 to
    # +360 deg at 5 % with no snag (the camera wire coils past about 240, fine). Joints 4 and 5 cannot
    # pass about 180 (URDF limits), and MoveIt holds joint 6 to its own +-360 limit.
    max_wrist_turn_deg: 360.0
    # true: AnyGrasp grasps are planned and published on /grasp/planned_solution, never executed.
    # Homing, the SELECTING steps and the gripper opening still move the arm (T1.51)
    plan_only: false
    # End the approach if the newest centroid is older than this. Age counts from the camera
    # frame, so it includes segmentation: about 1.05 s normally, 1.6 s after one dropped
    # frame (measured 2026-10-12, T1.24 3b). Raised to 3.0, then 7.0 (Dion, 2026-10-26): SAM 3
    # suddenly slowed, stalls of 2 to 4 s ended most approaches on the first step. Lower it once
    # SAM 3 is fast again: during a stall the arm steps on a centroid up to this old.
    centroid_max_age_s: 7.0
    # After a /manipulator/grasp_request, the first centroid must arrive within this time or the
    # request lapses (T1.25). SAM 3 gives the first one in about 1 s when the object is in view
    # (0.27 to 0.53 s per frame, 0.5 s warm-up, measured 2026-10-08 and 2026-10-12)
    grasp_request_timeout_s: 10.0
    # Wait before planning each Cartesian step, so the real arm has settled after the last one.
    # With no wait the second approach step was rejected, "start point deviates from current
    # robot state more than 0.01" (T1.24 3c, 2026-10-13)
    step_settle_s: 0.5
    # Read at start-up but used nowhere (T0.22, 2026-11-01). Consider deleting it and its line in
    # grasp_state_machine.cpp. Changing it does nothing.
    final_exec_thresh_m: 0.25
    # Each approach step steers so the object's centroid lands this many pixels right (x) and
    # down (y) of the image centre, not on it. The wrist camera sits beside the gripper, so the
    # gripper is centred on the object when the object is off the image centre. 55 since
    # 2026-04-08, [unverified] by measurement. If the gripper ends left or right of the object,
    # change x. If it ends high or low, change y. Simple path only (use_simple_execute true).
    centroid_target_offset_x_px: 55.0
    centroid_target_offset_y_px: 0.0
    # Which grasp the arm goes for. true: the simple path, straight at the SAM centroid, AnyGrasp
    # not used (CHANNEL_CONTRACT B-1, T1.17). false: the AnyGrasp path, the candidates from
    # anygrasp_detection_node, checked with the values from min_approach_angle_deg down.
    use_simple_execute: true
    # AnyGrasp path only. Grasps that approach flatter than this angle above horizontal are
    # skipped, degrees. 90 is straight down, 0 is from the side. Lower it to allow side grasps.
    # 0 = off since T1.51 (Dion, 2026-11-03): MoveIt's table collision check owns it.
    min_approach_angle_deg: 0.0
    # AnyGrasp path only. true turns the gripper toward the grasp's orientation by at most
    # max_orient_step_deg per move instead of going straight to it. Off since it was written,
    # [unverified] on the real arm.
    use_slerp_execute: false
    max_orient_step_deg: 5.0
    # AnyGrasp path only. The rank-sum lock (T1.62): each frame keeps its first stability_top_k
    # grasps that pass S1 to S3. A grasp of the newest frame counts if the same grasp (within
    # stability_trans_mm and stability_rot_deg, its 180 deg twin included) is in each of the last
    # stability_n_frames frames. The one with the lowest sum of ranks locks (the arm commits to
    # it), a tie goes to the better rank now. Before T1.62 only each frame's top grasp counted, and
    # one swap of the top two delayed the lock: no lock in 90 s with GraRe on (2026-11-03). The
    # same two limits decide whether a new grasp is one that already failed to plan (T1.48).
    # More frames or tighter limits: a surer grasp, but it locks later or never (lock_timeout_s).
    # A bigger stability_top_k locks sooner but can lock a grasp that is never near the top.
    # Read by grasp_state_machine.cpp.
    stability_n_frames: 5
    stability_top_k: 5
    # 20 deg since T1.62 (Dion, 2026-11-03, pose 2 at 45 deg): AnyGrasp's best grasp steps 13 to
    # 19 deg between frames while it stays within 15 mm, so at 10 nothing locked in 90 s. Dion
    # judged pairs 13 to 19 deg apart, side by side at one height, as one grasp. Pairs that
    # differ in height or need a sideways shift are different grasps by eye, but sit at the same
    # distance and angle, so no limit tells them apart. At 20 every earlier bag locks the same grasp.
    stability_trans_mm: 15.0
    stability_rot_deg: 20.0

    # ---- Arm motion (T0.22). read by: grasp_state_machine/src/mtc_planner.cpp
    # Share of the arm's top joint speed and acceleration (0 to 1) that every move may use: the
    # path to the pre-grasp, the straight-in move, each approach step, home and return. 0.1 since
    # the first real-arm moves (T1.7, 2026-09-23). Raise in small steps, simulated arm first, with
    # someone at the e-stop: a faster arm has less time to be stopped before it hits something.
    arm_max_velocity_scale: 0.1
    arm_max_acceleration_scale: 0.1
    # Home pose, joint1 to joint6, radians (0, 0, 45, 0, 90, 90 degrees). Also the return pose
    # for now. Validated on the real arm 2026-09-23 (T1.7): every joint reached within 0.02 deg,
    # tool in front of the arm's base (adb5466:docs/dion_docs/T1.7_FIRST_COMMANDED_MOTION.md).
    # Every move starts and ends here. Change only with a plan to check it at the robot.
    home_joints_rad: [0.0, 0.0, 0.7854, 0.0, 1.5708, 1.5708]
    # Longest wait for the arm's joint state when planning the pre-grasp, seconds. The joint
    # state comes many times a second, so this only runs out if rm_driver is down.
    joint_state_wait_s: 1.0
    # Time the IK solver gets to find the pre-grasp joints, seconds. It starts from the current
    # joints, so it lands on the nearest solution (T1.48). Raise it if "no IK for the pre-grasp"
    # shows up for a grasp that looks reachable.
    pregrasp_ik_timeout_s: 0.1
    # The approach plan (MTC) stops after finding this many complete plans and runs the best.
    # More gives a better path, but planning takes longer.
    approach_plan_solutions: 5
    # The straight-in move from the pre-grasp to the grasp is checked every this many metres
    # along its line. Smaller catches thinner collisions, slower to plan.
    straight_in_step_m: 0.005
    # Each approach step (moveCartesianStep) is planned as a straight line, checked every
    # cartesian_step_eef_step_m metres. cartesian_step_jump_threshold stops a plan where a joint
    # jumps much more than the average step (MoveIt's check, 0 turns it off). The step runs only
    # if at least cartesian_step_min_fraction of the line could be planned. Values from before
    # the 2026-09-21 reorg, [unverified] why. With 0.8 a step can stop at 80 % of its 2 cm.
    cartesian_step_eef_step_m: 0.01
    cartesian_step_jump_threshold: 5.0
    cartesian_step_min_fraction: 0.8

    # ---- Waits (T0.22). read by: grasp_state_machine/src/grasp_state_machine.cpp
    # EXECUTING: back to IDLE if no grasp candidates arrive for this long (T1.37). Must be longer
    # than one AnyGrasp frame: about 0.4 s alone, 2 to 3.5 s with GraRe on in the node (T1.61,
    # 2026-10-31). 6 gave GraRe on room (Dion, 2026-10-31), but frames took 6 to 7 s on the arm
    # on 2026-11-03, so 15, the value used that day (T1.62). With GraRe off it only waits longer
    # before giving up on an empty stream.
    candidate_timeout_s: 15.0
    # At start-up, wait this long before adding the safety walls and homing, so move_group and
    # its planning scene are up. Was 2 s, then 3 s more inside the wall code: one wait now, same
    # total. If the log shows "Waiting for planning scene to accept safety walls" many times,
    # raise it.
    startup_wait_s: 5.0
    # Retry gap while the planning scene has not taken the safety walls yet.
    safety_wall_retry_s: 0.5
    # Retry gap after homing or the return move fails to plan. The arm does not move while it
    # waits, so the gap only sets how often the log repeats.
    move_retry_s: 1.0
    # Longest wait for a TF transform (camera to arm) during each approach step, seconds. Short,
    # because TF is up to date by then and a stale step is worse than a skipped one.
    tf_wait_step_s: 0.1
    # Longest wait for the TF transform of an AnyGrasp grasp into base_link, seconds. Longer than
    # the step wait: it runs once per grasp.
    tf_wait_grasp_s: 1.0

    # ---- Gripper (T0.22). read by: grasp_state_machine.cpp (openGripper, closeGripper)
    # The commands are sent without waiting for the gripper (block false), then the node waits
    # this long so the gripper has finished before the arm moves on, seconds.
    gripper_move_wait_s: 1.5
    # Open position, 1 to 1000 for 0 to 70 mm (rm_ros_interfaces Gripperset.msg). 1000 = fully
    # open, which the 6 cm side of the test box needs.
    gripper_open_position: 1000
    # Closing: speed 1 to 1000 (no unit), force 1 to 1000 for up to 1.5 kg of grip
    # (Gripperpick.msg). The gripper stops when it feels this force. 150 is about 0.23 kg: enough
    # for the cardboard test box, raise for heavier objects, lower if it crushes soft ones.
    gripper_close_speed: 200
    gripper_close_force: 150

    # ---- Safety walls (T0.22). read by: grasp_state_machine.cpp (addSafetyWalls)
    # Boxes added to MoveIt's planning scene at start-up so no plan leaves the safe space. In
    # base_link (the arm's base), metres. Each wall stands on z = 0.
    # Thickness of every wall and of the table box.
    safety_wall_thickness_m: 0.03
    # The front wall's inner face: no plan goes past this x.
    safety_wall_front_x_m: 0.15
    # The two side walls' inner faces sit at +y and -y of this: no plan goes wider.
    safety_wall_side_y_m: 0.30
    # Length of each side wall along x, centred on the arm's base.
    safety_wall_side_length_m: 2.0
    # Height of all three walls.
    safety_wall_height_m: 1.0
    # The table box: a slab whose top is table_top_z_m (above), centred at this x, this wide in
    # x and y. It spans x from -0.80 to -0.05. CODE_AUDIT J6: these numbers want measuring at the
    # robot [unverified]. Values from before the 2026-09-21 reorg.
    table_box_centre_x_m: -0.425
    table_box_size_m: 0.75
