slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: robot_base_link
    scan_topic: /scan
    mode: localization
    # Commented out 2026-09-21 (reorg, NEXT_STEPS 2.15), delete when next working on this file.
    # It never took effect: slam_localization.launch.py:150 always overrides it with
    # <map_dir>/completed_map, where map_dir is in shared/global_config.yaml.
    # Keeping it here would write the same setting twice.
    # map_file_name: maps/completed_map
    map_start_at_dock: false
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0
    min_laser_range: 0.5
    minimum_time_interval: 0.0
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
