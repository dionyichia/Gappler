# Aria (glasses) config. Values only the aria subsystem reads (NEXT_STEPS 2.15).
# Values another subsystem also reads live in shared/global_config.yaml. Each value is written once.
#
# How it is read: the Aria app is not started by ROS. aria/aria_app/config/*.py load this file
# through gappler_common.config("aria", ...) and keep their class names, so callers do not change.
# Values that are facts of the Aria SDK or a model (stream IDs, sample rates), computed values
# (paths from the repo root, CUDA or CPU) and the visualizer's colours stay in those Python files.
#
# Format: a ROS parameter file. "/**" holds values several parts of aria read. Each other
# top-level key is one part's section.
/**:
  ros__parameters:
    # Topics only aria publishes and reads. publisher -> subscribers.
    topics:
      # image_streaming_pipeline -> visualizer
      rgb_camera_raw: "/aria/rgb_camera/raw"
      # pose_streaming_pipeline -> OpenVINS (parked). Its topic list is in
      #   aria_device/calibration/kalibr_imucam_chain.yaml and must match
      slam_left_raw: "/aria/slam_left/raw"
      slam_right_raw: "/aria/slam_right/raw"
      # image_streaming_pipeline -> visualizer
      eye_tracking_raw: "/aria/eye_tracking/raw"
      # image_streaming_pipeline -> object_recognition_pipeline, visualizer
      eye_tracking_gaze_estimate: "/aria/eye_tracking/gaze_estimate"
      # object_recognition_pipeline -> visualizer
      rgb_camera_with_object_masks: "/aria/rgb_camera/object_masks"
      # object_recognition_pipeline -> visualizer (masks drawn on the wrist camera image)
      ros_camera_with_object_masks: "/realman/rgb_camera/object_masks"
      # object_recognition_pipeline -> visualizer
      combined_visualization: "/combined/object_masks"
      # nobody -> visualizer. Was feature_matching (parked in archive/, T0.22) and
      # object_recognition_pipeline (stopped in T8.7)
      feature_match_results: "/aria/rgb_camera/feature_match"
      # pose_streaming_pipeline -> OpenVINS (parked). Must match calibration/kalibr_imu_chain.yaml
      imu: "/aria/imu"
      # image_streaming_pipeline -> pose_fusion_node (parked)
      aruco_pose: "/aria/aruco_pose"
      # nobody today. Planned: OpenVINS -> pose_fusion_node (both parked, the code is commented out)
      vio_pose: "/aria/vio_pose"
      # nobody yet
      is_stationary: "/aria/is_stationary"
      # pose_fusion_node -> RViz
      glasses_marker: "/aria/glasses_marker"
      # pose_fusion_node -> nobody yet
      pose_initialized: "/aria/pose_initialized"

    # QoS (ROS delivery rules) for the image streams. read by: object_recognition_pipeline,
    # visualizer, ros_publisher, realsense_helper (all through config.VIDEO_QOS)
    # BEST_EFFORT: a lost image is not sent again, so a slow reader gets the newest image, not a
    # backlog. A subscriber must ask for BEST_EFFORT too or it gets nothing. KEEP_LAST with depth
    # 10: at most 10 images wait per reader. Lower depth means less delay, more dropped images.
    qos:
      video:
        reliability: "BEST_EFFORT"
        history: "KEEP_LAST"
        depth: 10

    # JPEG quality (0 to 100) of the images aria publishes compressed. Higher is sharper and
    # bigger. 80 since the app was written.
    # read by: services/ros/image_helper.py (ImageHelper.compress_image, used by ros_publisher)
    jpeg_quality: 80

    # How far the gaze may be from a mask and still count as looking at it: the mask under the
    # gaze, else the nearest within this many pixels of the published 1408 px image. Recording
    # c2cbafe8 needed about 60 at 1.4 m (T2.9). Tune on more recordings.
    # read by: aria_segmentation_client (gaze pick vote), object_recognition_pipeline (T8.7 matcher
    # needs the gaze on the chosen glasses mask), tools/replay_recording_gaze_pick.py
    pick_radius_px: 80

# read by: aria/aria_app/config/base.py (Settings)
app:
  ros__parameters:
    # Read into Settings.REALSENSE_INIT_DELAY but used nowhere (T0.22, 2026-11-01). Changing it
    # does nothing. Consider deleting.
    realsense_init_delay_s: 3

# read by: aria/aria_app/config/aria.py (AriaConfig)
aria_device:
  ros__parameters:
    # The Aria SDK's streaming profile: which cameras and sensors stream, at what rate.
    # profile18 is for USB. Pick another from the Aria docs for Wi-Fi.
    # read by: schemas/application.py, then aria_device_controller.py
    streaming_profile_name: "profile18"
    # The glasses make a new security certificate for each streaming session, so none needs
    # installing first. The Aria SDK's own option.
    # read by: aria_device/aria_device_controller.py, aria_device/aria_stream_client.py
    use_ephemeral_certs: true
    # Size and focal length of the undistorted RGB image the app publishes.
    undistorted_image_size_px: 1408
    undistorted_focal_length_px: 609
    # Glasses IP for Wi-Fi streaming. Empty means USB.
    device_ip_address: ""

# read by: aria/aria_app/config/audio_streaming_pipeline_config.py
audio_streaming_pipeline:
  ros__parameters:
    # Whisper model that turns speech into text (faster-whisper name). small.en is English only.
    # A bigger model (medium.en) hears better and is slower. read by: audio_streaming_pipeline.py
    transcription_model: "small.en"
    # LLM that turns the transcript into an object name ("grab that apple" -> "apple"), a Hugging
    # Face name. read by: services/prompt_extractor.py
    llm_model: "Qwen/Qwen2.5-0.5B-Instruct"
    # Whisper's number precision (faster-whisper compute_type): int8, int8_float16, float16 or
    # float32. int8 since the app was written: smallest and fast enough on the box CPU and GPU.
    # [unverified] whether float16 hears words better on the GPU.
    # read by: aria_device/stream/audio_streaming_pipeline.py
    whisper_precision: "int8"
    # Whisper's beam search width. Wider tries more readings of each word, slower. 5 is
    # faster-whisper's default. read by: audio_streaming_pipeline.py
    whisper_beam_size: 5
    # The LLM's number precision: float32, float16 or bfloat16 (a torch dtype). float16 since the
    # app was written. read by: services/prompt_extractor.py
    llm_precision: "float16"
    # Longest reply the LLM may give, in tokens. The reply is one object name, a few tokens.
    # read by: services/prompt_extractor.py
    llm_max_new_tokens: 20
    # How often the newest audio goes to the voice detector. Cheap: Whisper and the LLM run
    # only once a sentence has finished (T2.10). Was 1 s.
    iteration_interval_s: 0.25
    # Audio kept, so the longest sentence heard in full. Commands take 2 to 6 s. Can go up to
    # 30 s (Whisper's own window), but the voice detector reruns over all of it every tick,
    # about 5 ms per second of audio (lab box, 2026-10-12). Was 10 s.
    max_buffer_s: 15
    # Quiet after speech that marks the end of a sentence. Shorter answers faster but may cut a
    # sentence at a pause. The voice detector also pads speech by 0.4 s (faster-whisper default,
    # set in audio_streaming_pipeline.py), so the word goes out about 1.1 s after the last word,
    # plus up to one tick. CHANNEL_CONTRACT A-5 accepts this wait to avoid half-heard words.
    end_of_speech_silence_s: 0.7
    stop_keyword: "end"
    # A sentence with one of these, as whole words, publishes true on /manipulator/release instead
    # of a word on /aria/audio/prompt, where goto_glasses would drive to you on it (T2.6).
    release_phrases: ["release", "let go"]

# read by: aria/aria_app/services/arcuo.py (detect_aruco, in image_streaming_pipeline.py)
aruco:
  ros__parameters:
    # Side of the printed ArUco marker (DICT_6X6_250), metres, black border to black border.
    # Measure the print: the marker's distance scales with it. Value from before the 2026-09-21
    # reorg, [unverified] against the marker in the lab.
    marker_side_m: 0.1325

# read by: aria/aria_app/services/pose_fusion/pose_fusion_node.py (parked with OpenVINS)
aria_pose_fusion:
  ros__parameters:
    # Where the ArUco marker sits relative to the robot's SLAM origin, in the robot frame.
    # Position in metres [x, y, z] and rotation as a quaternion [x, y, z, w]. Values from before
    # the 2026-09-21 reorg, [unverified]: measure the marker before the node is unparked.
    marker_offset_m: [-0.20, -0.25, 1.20]
    marker_offset_quat_xyzw: [-0.5, 0.5, -0.5, 0.5]

# read by: aria/aria_app/config/playback_controller_config.py
playback_controller:
  ros__parameters:
    # Replay speed of a recording: 1.0 is real time, 2.0 twice as fast.
    # read by: services/playback_controller.py
    playback_speed: 1.0

# read by: aria/aria_app/config/eye_tracking.py
eye_tracking:
  ros__parameters:
    # Gaze has no depth, so the gaze ray is cut at this distance (NEXT_STEPS 2.13, T2.3)
    default_depth_m: 1.5

# read by: aria/aria_app/services/object_recognition/object_recognition_pipeline.py
object_recognition_pipeline:
  ros__parameters:
    # SAM 3 masks scoring below this are dropped. T8.7: 0.5 missed the box, as T2.9 found for
    # the glasses, so 0.3.
    sam_confidence_threshold: 0.3
    # SAM 3's number precision on the GPU: bfloat16 or float32 (a torch dtype). bfloat16 since it
    # was written, to use less GPU memory, as the segmentation service does
    # (shared_services_config.yaml model_precision). float32 turns autocast off: more memory.
    # On a CPU it is float32 whatever this says.
    # read by: services/object_recognition/sam3_model.py, through object_recognition_pipeline.py
    sam_precision: "bfloat16"

# read by: aria/aria_app/services/aria_segmentation_client/ (and aria/tools/replay_recording_gaze_pick.py)
aria_segmentation_client:
  ros__parameters:
    # Images and gaze older than this (by arrival time) are dropped. Must cover the gaze window
    # plus speech_latency_s plus the images' 1 to 3 s delay (below), or the word finds nothing
    # to pick from. 20 s since T2.19: a long margin, the cost is memory only.
    history_s: 20.0
    # Gaze from this long votes on the mask: nobody holds their eyes on one point
    # (Dion, 2026-10-13). 1 s is 10 eye frames at the recorded 10 fps, about 4 on the box (4.5 a second).
    gaze_window_s: 1.0
    # The word arrives this long after you stop speaking (audio_worker waits for a pause, then
    # Whisper and the LLM run), so the gaze window ends this far back. Measured about 1.5 s on
    # the box with a recorded command, not counting the glasses' own audio delay (Dion, 2026-10-17).
    # A stopgap: T2.21 replaces it with the word's own capture time.
    speech_latency_s: 1.5
    # If no glasses image taken since you started speaking has arrived when the word comes, the
    # client waits up to this long for one. Images arrive 1 to 3 s late on the box (T2.9, T2.20).
    matching_image_wait_s: 3.0
    # The vote (T2.20): each gaze sample votes for the mask it picks. The mask with the most votes
    # wins if it has at least this share of them. Else the word alone stands.
    # 0.5 chosen by Dion (2026-10-17). Every value from 0.3 to 0.9 gave the same 60 of 61 on
    # recording c2cbafe8, a steady stare: tune on a recording where the eyes move between objects.
    vote_min_share: 0.5
    # Only gaze samples captured within this long of the image vote: the head moves the scene
    # under the gaze (T2.9_TIMING_REVIEW 9.10 point 1). Glasses clock on both.
    # 0.5 s chosen by Dion (2026-10-17): about 4 to 5 samples on the box, 10 on the recording.
    gaze_to_image_max_s: 0.5
